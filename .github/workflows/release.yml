name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Environment Config (.env)
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Artifacts
        id: prepare_apk
        run: |
          mkdir -p release_artifacts
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          
          # Locate debug APK
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "release_artifacts/JARVIS-Android-${TAG}.apk"
            echo "Found debug APK"
          fi
          
          ls -lh release_artifacts

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APKs
          path: release_artifacts/*

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: "J.A.R.V.I.S. on Android ${{ github.event.inputs.tag_name || github.ref_name }}"
          draft: false
          prerelease: false
          files: release_artifacts/*.apk
          body: |
            ## 🚀 J.A.R.V.I.S. on Android — Official Release
            
            **AI-dəstəkli, offline-first, rootsuz, Azərbaycan dilini tam dəstəkləyən real Android şəxsi AI agenti**
            
            ### 📦 APK Quraşdırma:
            Birbaşa `JARVIS-Android-${{ github.event.inputs.tag_name || github.ref_name }}.apk` faylını yükləyib cihazınıza quraşdırın.
            > ⚙️ Parametrlər → Tətbiqlər → Naməlum mənbələrdən quraşdırmaya icazə verin.
            
            ### ✨ Əsas Xüsusiyyətlər:
            - **60+ Sistem Aləti:** Batareya, RAM, CPU, Yaddaş, Səs, Fənər, Zəngli saat, Fayl, Şəbəkə, SMS, Zənglər.
            - **Lokal Yaddaş (Room SQLite v2):** `"Bunu yadda saxla"` / `"Bunu unut"`.
            - **On-Device RAG:** BM25 lokal axtarış (<1ms latency).
            - **Avtonom Agent:** 5-addımlı sistem diaqnostikası.
            - **4 GB RAM Optimizasiyası:** INT4 SLM, < 35 MB idle RAM.
            - **Android 9–16 (API 28–36) uyğunluq.**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
