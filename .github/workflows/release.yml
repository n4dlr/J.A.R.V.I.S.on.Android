name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Environment Config (.env)
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Prepare APK Artifacts
        id: prepare_apk
        run: |
          mkdir -p release_artifacts
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          
          # Locate debug APK
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "release_artifacts/JARVIS-Android-${TAG}-debug.apk"
          fi
          
          # Locate release APK
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk "release_artifacts/JARVIS-Android-${TAG}-release.apk"
          elif [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "release_artifacts/JARVIS-Android-${TAG}-release.apk"
          fi
          
          echo "ARTIFACTS_DIR=release_artifacts" >> $GITHUB_OUTPUT
          ls -lh release_artifacts

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APKs
          path: release_artifacts/*

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: "J.A.R.V.I.S. on Android ${{ github.event.inputs.tag_name || github.ref_name }} — Production Release"
          draft: false
          prerelease: false
          files: release_artifacts/*.apk
          body: |
            ## 🚀 J.A.R.V.I.S. on Android — Official Release
            
            **AI-dəstəkli, offline-first, rootsuz, Azərbaycan dilini tam dəstəkləyən real Android şəxsi AI agenti**
            
            ### 📦 Qoşulmuş APK Faylları:
            - **`JARVIS-Android-${{ github.event.inputs.tag_name || github.ref_name }}-debug.apk`** — Birbaşa quraşdırıla bilən standart APK (tövsiyə olunur).
            - **`JARVIS-Android-${{ github.event.inputs.tag_name || github.ref_name }}-release.apk`** — Production Release APK.
            
            ### ✨ Əsas Xüsusiyyətlər:
            - **60+ Sistem Aləti:** Batareya, RAM, CPU, Yaddaş, Səs, Fənər, Zəngli saat, Fayl idarəsi, Şəbəkə, SMS, Zənglər, Əlçatımlılıq.
            - **Lokal Yaddaş (Room SQLite v2):** Faktlar (`"Bunu yadda saxla"`), Tərcihlər, Tapşırıqlar.
            - **On-Device RAG:** Sürətli BM25 lokal axtarış mexanizmi (<1ms).
            - **Avtonom Agent:** 5-addımlı sistem diaqnostikası (`"Telefonum niyə yavaşdır?"`).
            - **4 GB RAM Optimizasiyası:** 4-bit INT4 SLM, KV-cache trim, < 35 MB idle RAM.
            - **100% Rootless:** Bütün Android 9+ (API 28-36) cihazlarla tam uyğunluq.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
